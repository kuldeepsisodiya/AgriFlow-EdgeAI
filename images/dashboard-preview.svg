<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%" style="background:#070d19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="dashCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="1">BLYNK IOT 2.0 CLOUD DASHBOARD PREVIEW</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#94a3b8">Real-Time Mobile &amp; Web Telemetry Interface with Bi-Directional Actuator Control</text>

  <!-- Phone Frame -->
  <g transform="translate(60, 85)">
    <rect width="320" height="480" rx="36" fill="url(#phoneGrad)" stroke="#38bdf8" stroke-width="2"/>
    <!-- Top Notch & Speaker -->
    <rect x="110" y="12" width="100" height="16" rx="8" fill="#070d19"/>
    <circle cx="130" cy="20" r="3" fill="#334155"/>
    <rect x="145" y="18" width="35" height="4" rx="2" fill="#334155"/>

    <!-- App Header -->
    <text x="24" y="56" font-size="14" font-weight="700" fill="#10b981">AgriFlow EdgeAI</text>
    <circle cx="280" cy="52" r="5" fill="#10b981"/>
    <text x="290" y="55" font-size="9" fill="#94a3b8">LIVE</text>

    <!-- Gauge 1: Soil Moisture -->
    <g transform="translate(20, 75)">
      <rect width="135" height="110" rx="12" fill="url(#dashCard)" stroke="#334155"/>
      <text x="15" y="24" font-size="11" font-weight="600" fill="#94a3b8">Soil Moisture (V0)</text>
      <text x="15" y="60" font-size="28" font-weight="800" fill="#34d399">28%</text>
      <!-- Progress Bar -->
      <rect x="15" y="78" width="105" height="6" rx="3" fill="#334155"/>
      <rect x="15" y="78" width="30" height="6" rx="3" fill="#10b981"/>
      <text x="15" y="98" font-size="9" fill="#f59e0b">STATUS: DRY (DEFICIT)</text>
    </g>

    <!-- Gauge 2: Water Reservoir -->
    <g transform="translate(165, 75)">
      <rect width="135" height="110" rx="12" fill="url(#dashCard)" stroke="#334155"/>
      <text x="15" y="24" font-size="11" font-weight="600" fill="#94a3b8">Reservoir Level (V2)</text>
      <text x="15" y="60" font-size="28" font-weight="800" fill="#60a5fa">82%</text>
      <rect x="15" y="78" width="105" height="6" rx="3" fill="#334155"/>
      <rect x="15" y="78" width="86" height="6" rx="3" fill="#3b82f6"/>
      <text x="15" y="98" font-size="9" fill="#10b981">CAPACITY: OPTIMAL</text>
    </g>

    <!-- Gauge 3: Temp & Humidity -->
    <g transform="translate(20, 195)">
      <rect width="280" height="85" rx="12" fill="url(#dashCard)" stroke="#334155"/>
      <text x="15" y="24" font-size="11" font-weight="600" fill="#94a3b8">Microclimate Conditions (V3 / V4)</text>
      <text x="25" y="58" font-size="20" font-weight="700" fill="#fef3c7">28.4 °C</text>
      <text x="25" y="74" font-size="9" fill="#94a3b8">Temperature</text>
      <line x1="135" y1="35" x2="135" y2="78" stroke="#334155"/>
      <text x="160" y="58" font-size="20" font-weight="700" fill="#67e8f9">62.0 %</text>
      <text x="160" y="74" font-size="9" fill="#94a3b8">Rel. Humidity</text>
    </g>

    <!-- Controls: Mode & Pump Switch -->
    <g transform="translate(20, 290)">
      <rect width="280" height="90" rx="12" fill="url(#dashCard)" stroke="#10b981" stroke-width="1.5"/>
      <text x="15" y="26" font-size="11" font-weight="700" fill="#a7f3d0">Pump Actuation (V1)</text>
      <rect x="15" y="40" width="110" height="36" rx="6" fill="#064e3b" stroke="#10b981"/>
      <circle cx="32" cy="58" r="5" fill="#10b981"/>
      <text x="45" y="62" font-size="12" font-weight="700" fill="#f8fafc">RUNNING</text>

      <!-- Mode Switch -->
      <rect x="145" y="40" width="120" height="36" rx="6" fill="#1e293b" stroke="#8b5cf6"/>
      <text x="160" y="62" font-size="11" font-weight="600" fill="#c084fc">Mode: AUTO</text>
    </g>

    <!-- Activity Log Widget -->
    <g transform="translate(20, 390)">
      <rect width="280" height="70" rx="12" fill="url(#dashCard)" stroke="#334155"/>
      <text x="15" y="22" font-size="10" font-weight="600" fill="#94a3b8">Event Terminal (V6)</text>
      <text x="15" y="40" font-size="9" font-family="monospace" fill="#38bdf8">[16:02:14] Irrigation Auto-Engaged</text>
      <text x="15" y="56" font-size="9" font-family="monospace" fill="#10b981">[16:02:16] Telemetry Synced to Cloud</text>
    </g>
  </g>

  <!-- Web Dashboard Side (Desktop Browser View) -->
  <g transform="translate(420, 85)">
    <rect width="440" height="480" rx="16" fill="url(#dashCard)" stroke="#475569" stroke-width="1.8"/>
    <!-- Browser Title Bar -->
    <rect width="440" height="35" rx="16" fill="#1e293b"/>
    <circle cx="20" cy="18" r="4" fill="#ef4444"/>
    <circle cx="35" cy="18" r="4" fill="#f59e0b"/>
    <circle cx="50" cy="18" r="4" fill="#10b981"/>
    <rect x="80" y="8" width="280" height="20" rx="4" fill="#0f172a"/>
    <text x="220" y="22" text-anchor="middle" font-size="10" fill="#64748b">blynk.cloud/dashboard/agriflow-edgeai</text>

    <!-- Web Chart: Historical Soil Moisture Depletion -->
    <g transform="translate(20, 55)">
      <text x="0" y="16" font-size="12" font-weight="700" fill="#f8fafc">Soil Moisture 24-Hour Telemetry Curve (V0)</text>
      <rect x="0" y="30" width="400" height="180" rx="8" fill="#0f172a" stroke="#334155"/>
      <!-- Grid Lines -->
      <line x1="40" y1="60" x2="380" y2="60" stroke="#1e293b" stroke-dasharray="2,2"/>
      <line x1="40" y1="100" x2="380" y2="100" stroke="#1e293b" stroke-dasharray="2,2"/>
      <line x1="40" y1="140" x2="380" y2="140" stroke="#1e293b" stroke-dasharray="2,2"/>
      <line x1="40" y1="180" x2="380" y2="180" stroke="#334155"/>
      <text x="15" y="65" font-size="9" fill="#64748b">80%</text>
      <text x="15" y="105" font-size="9" fill="#64748b">65%</text>
      <text x="15" y="145" font-size="9" fill="#64748b">35%</text>
      <!-- Hysteresis Threshold Lines -->
      <line x1="40" y1="100" x2="380" y2="100" stroke="#10b981" stroke-dasharray="4,4"/>
      <text x="310" y="95" font-size="8" fill="#10b981">Wet Limit (65%)</text>
      <line x1="40" y1="140" x2="380" y2="140" stroke="#ef4444" stroke-dasharray="4,4"/>
      <text x="310" y="135" font-size="8" fill="#ef4444">Dry Trigger (35%)</text>
      <!-- Curve -->
      <path d="M 50 70 Q 120 130 180 148 L 200 85 Q 270 120 330 145 L 350 82" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <!-- Pump event markers -->
      <circle cx="180" cy="148" r="4" fill="#10b981"/>
      <circle cx="330" cy="145" r="4" fill="#10b981"/>
      <text x="165" y="165" font-size="8" fill="#a7f3d0">Pump ON</text>
      <text x="315" y="165" font-size="8" fill="#a7f3d0">Pump ON</text>
    </g>

    <!-- Web Stats Cards -->
    <g transform="translate(20, 290)">
      <rect width="125" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="22" font-size="10" fill="#94a3b8">Daily Water Used</text>
      <text x="12" y="52" font-size="20" font-weight="700" fill="#38bdf8">14.8 L</text>
      <text x="12" y="72" font-size="8" fill="#10b981">-42% vs timer</text>
    </g>

    <g transform="translate(155, 290)">
      <rect width="125" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="22" font-size="10" fill="#94a3b8">Pump Duty Cycle</text>
      <text x="12" y="52" font-size="20" font-weight="700" fill="#f59e0b">8.2 %</text>
      <text x="12" y="72" font-size="8" fill="#94a3b8">Avg 4.2 min/day</text>
    </g>

    <g transform="translate(290, 290)">
      <rect width="130" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="22" font-size="10" fill="#94a3b8">System Health</text>
      <text x="12" y="52" font-size="20" font-weight="700" fill="#10b981">99.8%</text>
      <text x="12" y="72" font-size="8" fill="#10b981">0 Failsafe Trips</text>
    </g>

    <!-- Agronomic Recommendations -->
    <g transform="translate(20, 395)">
      <rect width="400" height="65" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
      <text x="15" y="22" font-size="11" font-weight="700" fill="#34d399">Edge-AI Agronomic Recommendation</text>
      <text x="15" y="40" font-size="10" fill="#cbd5e1">Atmospheric Vapor Pressure Deficit (VPD) = 1.42 kPa (Ideal transpiration window).</text>
      <text x="15" y="54" font-size="9" fill="#94a3b8">Root hydration sustained within field capacity (35% - 65% VWC).</text>
    </g>
  </g>
</svg>
