<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%" style="background:#0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="mcuGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pwrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <marker id="hw-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="pwr-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc" letter-spacing="1">AGRIFLOW-EDGEAI: HARDWARE BLOCK DIAGRAM</text>
  <text x="550" y="65" text-anchor="middle" font-size="12" fill="#94a3b8">Power Distribution, Optoisolation Barriers, Sensor Interfaces &amp; Actuator Circuits</text>

  <!-- ================= POWER SUPPLY SECTION (TOP LEFT) ================= -->
  <g transform="translate(40, 100)">
    <rect width="250" height="150" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="125" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#fef3c7">Primary Power Source</text>
    <text x="15" y="52" font-size="11" fill="#cbd5e1">• 12V 2A DC Wall Adapter</text>
    <text x="15" y="70" font-size="11" fill="#cbd5e1">• Barrel Jack / Reverse Polarity Diode</text>
    <line x1="15" y1="82" x2="235" y2="82" stroke="#334155"/>
    <text x="15" y="102" font-size="11" font-weight="600" fill="#f59e0b">Rail 1: 12V DC (Pump Power)</text>
    <text x="15" y="122" font-size="11" font-weight="600" fill="#38bdf8">Rail 2: LM2596 DC-DC Buck (Step to 5V)</text>
    <text x="15" y="138" font-size="10" fill="#94a3b8">Efficiency: 92% | Ripple: &lt; 30mV</text>
  </g>

  <!-- ================= MICROCONTROLLER (CENTER) ================= -->
  <g transform="translate(370, 100)">
    <rect width="360" height="540" rx="16" fill="url(#mcuGrad)" stroke="#38bdf8" stroke-width="2.2"/>
    <rect width="360" height="42" rx="16" fill="#1e293b"/>
    <rect y="30" width="360" height="12" fill="#1e293b"/>
    <circle cx="395" cy="121" r="6" fill="#38bdf8"/>
    <text x="180" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">ESP32-WROOM-32 DevKit V1</text>

    <!-- Sub-blocks inside MCU -->
    <g transform="translate(20, 60)">
      <rect width="320" height="60" rx="8" fill="#111827" stroke="#334155"/>
      <text x="160" y="24" text-anchor="middle" font-size="12" font-weight="600" fill="#38bdf8">Xtensa® Dual-Core 32-bit LX6 @ 240MHz</text>
      <text x="160" y="44" text-anchor="middle" font-size="11" fill="#94a3b8">520 KB SRAM | 4 MB SPI Flash ROM</text>
    </g>

    <g transform="translate(20, 135)">
      <rect width="320" height="85" rx="8" fill="#111827" stroke="#10b981"/>
      <text x="15" y="22" font-size="12" font-weight="700" fill="#34d399">Dedicated ADC1 Controller</text>
      <text x="15" y="42" font-size="11" fill="#cbd5e1">• GPIO35 (ADC1_CH7) &lt;- Soil Moisture</text>
      <text x="15" y="60" font-size="11" fill="#cbd5e1">• GPIO34 (ADC1_CH6) &lt;- Reservoir Level</text>
      <text x="15" y="76" font-size="10" fill="#94a3b8">*ADC1 isolated from Wi-Fi RF SAR ADC noise</text>
    </g>

    <g transform="translate(20, 235)">
      <rect width="320" height="70" rx="8" fill="#111827" stroke="#8b5cf6"/>
      <text x="15" y="22" font-size="12" font-weight="700" fill="#c084fc">Digital GPIO Peripherals</text>
      <text x="15" y="42" font-size="11" fill="#cbd5e1">• GPIO4 &lt;- DHT22 1-Wire Single-Bus</text>
      <text x="15" y="60" font-size="11" fill="#cbd5e1">• GPIO21 -&gt; RGB Status NeoPixel/LED</text>
    </g>

    <g transform="translate(20, 320)">
      <rect width="320" height="80" rx="8" fill="#111827" stroke="#ef4444"/>
      <text x="15" y="22" font-size="12" font-weight="700" fill="#f87171">Actuator Control Interface</text>
      <text x="15" y="42" font-size="11" fill="#cbd5e1">• GPIO5 -&gt; Relay Driver (Active LOW)</text>
      <text x="15" y="60" font-size="11" fill="#cbd5e1">• Safe default LOW at boot (No glitching)</text>
      <text x="15" y="74" font-size="10" fill="#94a3b8">*Hardware boot-strap safe strapping pin</text>
    </g>

    <g transform="translate(20, 415)">
      <rect width="320" height="95" rx="8" fill="#111827" stroke="#3b82f6"/>
      <text x="15" y="22" font-size="12" font-weight="700" fill="#60a5fa">Wireless Transceiver</text>
      <text x="15" y="42" font-size="11" fill="#cbd5e1">• 2.4 GHz 802.11 b/g/n Wi-Fi</text>
      <text x="15" y="60" font-size="11" fill="#cbd5e1">• TLS 1.3 Secure Blynk IoT Connection</text>
      <text x="15" y="78" font-size="11" fill="#cbd5e1">• PCB Trace Antenna with Matching Network</text>
    </g>
  </g>

  <!-- ================= SENSORS (LEFT COLUMN) ================= -->
  <!-- Soil Sensor -->
  <g transform="translate(40, 275)">
    <rect width="250" height="95" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="15" y="24" font-size="12" font-weight="700" fill="#34d399">Capacitive Moisture v1.2</text>
    <text x="15" y="44" font-size="11" fill="#cbd5e1">• Supply: 3.3V / 5V DC</text>
    <text x="15" y="62" font-size="11" fill="#cbd5e1">• Output: 1.2V - 3.0V Analog</text>
    <text x="15" y="82" font-size="10" fill="#38bdf8">Analog Pin -&gt; GPIO35</text>
  </g>

  <!-- Water Level Sensor -->
  <g transform="translate(40, 395)">
    <rect width="250" height="95" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="15" y="24" font-size="12" font-weight="700" fill="#60a5fa">Submersible Water Level</text>
    <text x="15" y="44" font-size="11" fill="#cbd5e1">• Supply: 3.3V / 5V DC</text>
    <text x="15" y="62" font-size="11" fill="#cbd5e1">• Output: Analog Resistance</text>
    <text x="15" y="82" font-size="10" fill="#38bdf8">Analog Pin -&gt; GPIO34</text>
  </g>

  <!-- DHT22 Sensor -->
  <g transform="translate(40, 515)">
    <rect width="250" height="95" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="15" y="24" font-size="12" font-weight="700" fill="#fbbf24">DHT22 (AM2302)</text>
    <text x="15" y="44" font-size="11" fill="#cbd5e1">• Supply: 3.3V DC</text>
    <text x="15" y="62" font-size="11" fill="#cbd5e1">• 10kΩ Pullup to 3.3V Rail</text>
    <text x="15" y="82" font-size="10" fill="#38bdf8">Data Pin -&gt; GPIO4</text>
  </g>

  <!-- ================= ACTUATORS (RIGHT COLUMN) ================= -->
  <!-- Optocoupled Relay -->
  <g transform="translate(800, 160)">
    <rect width="260" height="150" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.8"/>
    <text x="130" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#fca5a5">Optocoupler Relay Module</text>
    <text x="15" y="52" font-size="11" fill="#cbd5e1">• PC817 Phototransistor Isolator</text>
    <text x="15" y="70" font-size="11" fill="#cbd5e1">• Songle 5V DC Relay (10A 250VAC)</text>
    <text x="15" y="88" font-size="11" fill="#cbd5e1">• Flyback Diode (1N4007) Suppression</text>
    <line x1="15" y1="98" x2="245" y2="98" stroke="#334155"/>
    <text x="15" y="118" font-size="11" font-weight="600" fill="#ef4444">Control: GPIO5 (Active LOW)</text>
    <text x="15" y="136" font-size="11" fill="#94a3b8">Galvanically isolates ESP32 logic</text>
  </g>

  <!-- 12V Pump -->
  <g transform="translate(800, 345)">
    <rect width="260" height="130" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="130" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#67e8f9">12V DC Irrigation Pump</text>
    <text x="15" y="50" font-size="11" fill="#cbd5e1">• Submersible / R385 Diaphragm</text>
    <text x="15" y="68" font-size="11" fill="#cbd5e1">• Operating: 12V @ 0.8A - 1.2A</text>
    <text x="15" y="86" font-size="11" fill="#cbd5e1">• Flow Rate: 1.5 - 2.0 L/min</text>
    <line x1="15" y1="96" x2="245" y2="96" stroke="#334155"/>
    <text x="15" y="116" font-size="11" font-weight="600" fill="#f59e0b">Power: 12V via Relay NO Terminal</text>
  </g>

  <!-- RGB Status Indicator -->
  <g transform="translate(800, 505)">
    <rect width="260" height="105" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="130" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#c084fc">Visual Telemetry Indicator</text>
    <text x="15" y="50" font-size="11" fill="#cbd5e1">• WS2812B / Tri-Color RGB LED</text>
    <text x="15" y="68" font-size="11" fill="#cbd5e1">• Current limiting resistor: 330Ω</text>
    <text x="15" y="88" font-size="11" font-weight="600" fill="#a855f7">Signal: GPIO21</text>
  </g>

  <!-- ================= WIRING LINES ================= -->
  <!-- Soil to MCU -->
  <path d="M 290 322 L 370 250" stroke="#10b981" stroke-width="1.8" marker-end="url(#hw-arrow)"/>
  <!-- Water Level to MCU -->
  <path d="M 290 442 L 370 268" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#hw-arrow)"/>
  <!-- DHT22 to MCU -->
  <path d="M 290 562 L 370 355" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#hw-arrow)"/>
  <!-- MCU to Relay -->
  <path d="M 730 435 L 800 235" stroke="#ef4444" stroke-width="1.8" marker-end="url(#hw-arrow)"/>
  <!-- Relay to Pump -->
  <path d="M 930 310 L 930 345" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#pwr-arrow)"/>
  <!-- MCU to LED -->
  <path d="M 730 365 L 800 550" stroke="#a855f7" stroke-width="1.8" marker-end="url(#hw-arrow)"/>
  <!-- Power 12V to Relay -->
  <path d="M 290 145 L 850 145 L 850 160" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="560" y="138" font-size="10" fill="#f59e0b">12V Power Bus to Relay COM Contact</text>

</svg>
